{% extends "base.html" %}
{% block title %}ホーム - 案件管理システム{% endblock %}
{% block content %}
<div class="page-header">
  <h1>ホーム</h1>
</div>

<p class="text-muted">ようこそ、{{ current_user.name }} さん。</p>

<div class="stat-grid">
  <div class="stat">
    <div class="num">{{ project_count }}</div>
    <div class="label">登録案件数</div>
  </div>
  <div class="stat">
    <div class="num">{{ user_count }}</div>
    <div class="label">有効ユーザー数</div>
  </div>
</div>

<div class="card" style="margin-top:16px;">
  <h2>案件管理</h2>
  <p>
    <a class="btn" href="{{ url_for('projects.list_projects') }}">案件一覧を開く</a>
    <a class="btn btn-outline" href="{{ url_for('projects.new') }}">＋ 案件を登録</a>
    <a class="btn btn-outline" href="{{ url_for('imports.upload_page') }}">インポート</a>
  </p>
  <p class="text-muted" style="margin-top:12px;">
    案件の検索・登録・編集・削除、エクスポート（CSV/Excel/PDF）、インポート（Excel/CSV）がご利用いただけます。
  </p>
</div>
{% endblock %}
