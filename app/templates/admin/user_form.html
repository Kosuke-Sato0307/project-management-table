{% extends "base.html" %}
{% block title %}ユーザー登録 - 案件管理システム{% endblock %}
{% block content %}
<div style="max-width: 460px; margin: 0 auto;">
  <div class="page-header">
    <h1>ユーザー登録</h1>
    <a class="btn btn-sm btn-outline" href="{{ url_for('admin.users') }}">← 一覧へ</a>
  </div>
  <div class="card">
    <form method="post" action="{{ url_for('admin.new_user') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="user_id">ログインID <span class="text-danger">*</span></label>
        <input type="text" id="user_id" name="user_id" required autofocus>
        <div class="help-text">半角英数字を推奨（例: yamada）。後から変更できません。</div>
      </div>
      <div class="form-group">
        <label for="name">氏名 <span class="text-danger">*</span></label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="role">権限</label>
        <select id="role" name="role">
          <option value="user" selected>一般（案件の閲覧・編集）</option>
          <option value="admin">管理者（＋ユーザー管理）</option>
        </select>
      </div>
      <p class="help-text">
        登録すると初期パスワードが自動発行され、この後の画面に一度だけ表示されます。<br>
        本人に伝えてください（初回ログイン時に本人がパスワードを変更します）。
      </p>
      <button type="submit" class="btn btn-block">登録する</button>
    </form>
  </div>
</div>
{% endblock %}
