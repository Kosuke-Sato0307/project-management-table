{% extends "base.html" %}
{% block title %}ユーザー編集 - 案件管理システム{% endblock %}
{% block content %}
<div style="max-width: 520px; margin: 0 auto;">
  <div class="page-header">
    <h1>ユーザー編集</h1>
    <a class="btn btn-sm btn-outline" href="{{ url_for('admin.users') }}">← 一覧へ</a>
  </div>
  <div class="card">
    <form method="post" action="{{ url_for('admin.edit_user', user_id=user.user_id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>ログインID</label>
        <input type="text" value="{{ user.user_id }}" disabled>
      </div>
      <div class="form-group">
        <label for="name">氏名 <span class="text-danger">*</span></label>
        <input type="text" id="name" name="name" value="{{ user.name }}" required>
      </div>
      <div class="form-group">
        <label for="role">権限</label>
        <select id="role" name="role">
          <option value="user"     {% if user.role == 'user' %}selected{% endif %}>一般ユーザー（自部門の閲覧・自担当案件の編集）</option>
          <option value="admin"    {% if user.role == 'admin' %}selected{% endif %}>管理者（全部門の閲覧・自部門の編集）</option>
          <option value="sysadmin" {% if user.role == 'sysadmin' %}selected{% endif %}>システム管理者（全権・ユーザー管理）</option>
        </select>
      </div>
      <div class="form-group">
        <label>所属部門（複数選択可）</label>
        <div class="checkbox-grid">
          {% set assigned = user.department_ids %}
          {% for d in departments %}
          <label class="checkbox-item">
            <input type="checkbox" name="department_ids" value="{{ d.id }}"
                   {% if d.id in assigned %}checked{% endif %}>
            {{ d.name }}
          </label>
          {% endfor %}
        </div>
      </div>
      <button type="submit" class="btn btn-block">更新する</button>
    </form>
  </div>
</div>
{% endblock %}
