{% set g = gran if gran is defined else None %}
<div class="page-header">
  <h1>数字まとめ</h1>
</div>

{% if department %}
<div class="card dept-bar">
  <label style="display:inline-block; margin-right:8px;">部門</label>
  <select onchange="if(this.value){location.href=this.value;}"
          style="max-width:280px; display:inline-block; width:auto;">
    {% for d in viewable %}
    <option value="{{ url_for(request.endpoint, dept=d.id, gran=g, period=period) }}"
            {% if d.id == department.id %}selected{% endif %}>{{ d.name }}</option>
    {% endfor %}
  </select>
  <label style="display:inline-block; margin:0 8px 0 12px;">期</label>
  <select onchange="if(this.value){location.href=this.value;}"
          style="display:inline-block; width:auto;">
    {% for p in periods %}
    <option value="{{ url_for(request.endpoint, dept=department.id, gran=g, period=p) }}"
            {% if p == period %}selected{% endif %}>{{ p }}期</option>
    {% endfor %}
  </select>
  <span class="period-tag">{{ period_label }}</span>
</div>

<div class="tabs">
  <a class="tab {% if active_view == 'yojitsu' %}active{% endif %}"  href="{{ url_for('analytics.yojitsu', dept=department.id, period=period) }}">予実まとめ</a>
  <a class="tab {% if active_view == 'soneki' %}active{% endif %}"   href="{{ url_for('analytics.soneki', dept=department.id, period=period) }}">損益まとめ</a>
  <a class="tab {% if active_view == 'category' %}active{% endif %}" href="{{ url_for('analytics.category', dept=department.id, period=period) }}">カテゴリー別</a>
  <a class="tab {% if active_view == 'rank' %}active{% endif %}"     href="{{ url_for('analytics.rank', dept=department.id, period=period) }}">確度別</a>
  <a class="tab {% if active_view == 'sga' %}active{% endif %}"      href="{{ url_for('analytics.sga', dept=department.id, period=period) }}">販管費入力</a>
</div>
{% endif %}
