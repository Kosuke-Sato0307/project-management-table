{% extends "base.html" %}
{% block title %}ログイン - 案件管理システム{% endblock %}
{% block content %}
<div class="login-wrap">
  <h1 class="login-title">案件管理システム</h1>

  <div class="card">
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="user_id">ログインID</label>
        <input type="text" id="user_id" name="user_id" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-block">ログイン</button>
    </form>
  </div>
</div>
{% endblock %}
