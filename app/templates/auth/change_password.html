{% extends "base.html" %}
{% block title %}パスワード変更 - 案件管理システム{% endblock %}
{% block content %}
<div style="max-width: 460px; margin: 0 auto;">
  <h1 class="page-header">パスワード変更</h1>
  {% if current_user.must_change_password %}
    <p class="text-muted">初回ログインのため、パスワードの変更が必要です。</p>
  {% endif %}
  <div class="card">
    <form method="post" action="{{ url_for('auth.change_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="current_password">現在のパスワード</label>
        <input type="password" id="current_password" name="current_password" required>
      </div>
      <div class="form-group">
        <label for="new_password">新しいパスワード</label>
        <input type="password" id="new_password" name="new_password" required>
        <div class="help-text">8文字以上で設定してください。</div>
      </div>
      <div class="form-group">
        <label for="new_password_confirm">新しいパスワード（確認）</label>
        <input type="password" id="new_password_confirm" name="new_password_confirm" required>
      </div>
      <button type="submit" class="btn btn-block">変更する</button>
    </form>
  </div>
</div>
{% endblock %}
