# 案件管理システム: Docker Compose 設定
# 起動:  docker compose up -d
# 停止:  docker compose down
services:
  web:
    build: .
    # 社内LANのみで使う想定。127.0.0.1 に絞ると同一PCのみ、
    # 社内の他PCからもアクセスさせる場合は "${APP_PORT:-8000}:8000" に変更。
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-key-change-me}
      - TZ=${TZ:-Asia/Tokyo}
      - DATABASE_URL=sqlite:////app/data/app.db
    volumes:
      # DB本体（SQLite）を永続化。ここをバックアップすればデータを保全できる。
      - ./data:/app/data
    restart: unless-stopped
